name: Lake Watch

# Weekly brief on Lake Mattoon. Two jobs, deliberately separate:
#
#   brief    — gathers what actually changed (water quality, watershed
#              planning, upcoming meeting agendas across all four governments
#              with authority over the lake), has Claude write it up, and opens
#              a PR with the draft. Evidence gathering is deterministic; Claude
#              only writes, and only from that evidence.
#   discover — looks for sources we don't track yet and files them as an issue.
#
# Nothing publishes itself. This repo IS the live site, so every automated
# change is reviewed before it is served.

on:
  schedule:
    - cron: '0 14 * * 1'   # Mondays, 9:00 AM CT
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  brief:
    name: Write the weekly brief
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet anthropic certifi pypdf

      - name: Refresh water quality readings
        run: |
          python3 scripts/lakewatch/watch.py | tee "$RUNNER_TEMP/water.txt"
          {
            echo "## Water quality"
            echo '```'
            cat "$RUNNER_TEMP/water.txt"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Write the brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set — cannot write the brief."
            exit 1
          fi
          python3 scripts/lakewatch/brief.py | tee "$RUNNER_TEMP/brief.txt"
          {
            echo "## Brief"
            echo '```'
            cat "$RUNNER_TEMP/brief.txt"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Open or update the review PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A data content
          if git diff --cached --quiet; then
            echo "Nothing changed this week." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          BRANCH=lake-watch/brief
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -q -m "Lake Watch brief for $(date +%Y-%m-%d)"
          git push --force-with-lease origin "$BRANCH"

          BODY=$(printf 'Automated weekly brief.\n\n```\n%s\n%s\n```\n\nReview the draft in `content/news/`, then merge to publish.' \
            "$(cat "$RUNNER_TEMP/water.txt")" "$(cat "$RUNNER_TEMP/brief.txt")")

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr comment "$BRANCH" --body "$BODY"
            echo "Updated the existing brief PR." >> $GITHUB_STEP_SUMMARY
          elif gh pr create --base main --head "$BRANCH" \
                 --title "Lake Watch brief — $(date +%B %-d, %Y)" --body "$BODY"; then
            echo "Opened the brief PR." >> $GITHUB_STEP_SUMMARY
          else
            # Actions cannot open PRs unless "Allow GitHub Actions to create and
            # approve pull requests" is enabled (Settings > Actions > General).
            # The branch is pushed either way, so the work is never lost.
            COMPARE="https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
            echo "::warning::Could not open a PR automatically. Branch \`$BRANCH\` is pushed — open it here: $COMPARE"
            {
              echo "### Branch pushed, PR not opened"
              echo "GitHub Actions is not permitted to create pull requests in this repo."
              echo "Enable it under **Settings → Actions → General → Workflow permissions**, or open the PR manually:"
              echo ""
              echo "$COMPARE"
            } >> $GITHUB_STEP_SUMMARY
          fi

      - name: Flag any advisory exceedance
        run: |
          EX=$(python3 -c "import json;print(json.load(open('data/water-quality.json'))['exceedances'])")
          if [ "$EX" -gt 0 ]; then
            echo "::warning::$EX reading(s) above the 0.30 ppb advisory — review before publishing."
          fi

  discover:
    name: Search for new sources
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet anthropic certifi

      - name: Ask Claude for candidate sources
        id: discover
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY not set — skipping source discovery."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/lakewatch/discover.py > "$RUNNER_TEMP/candidates.md"
          if grep -q '^NO_CANDIDATES$' "$RUNNER_TEMP/candidates.md"; then
            echo "No new sources found this week." >> $GITHUB_STEP_SUMMARY
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open review issue
        if: steps.discover.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Candidate watershed sources — week of $(date +%Y-%m-%d)" \
            --body-file "$RUNNER_TEMP/candidates.md"
          echo "Opened a review issue." >> $GITHUB_STEP_SUMMARY
